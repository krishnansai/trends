<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="title desc">
  <title id="title">Stacked Stainless Steel Rings</title>
  <desc id="desc">Brushed and polished stainless steel rings arranged on dark fabric.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#242424"/>
      <stop offset="1" stop-color="#5f5a55"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".35" stop-color="#c9cbcb"/>
      <stop offset=".75" stop-color="#73777a"/>
      <stop offset="1" stop-color="#f6f6f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="22" flood-color="#000000" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <g fill="none" stroke="#ffffff" stroke-width="2" opacity=".08">
    <path d="M0 220c172 44 314 47 426 10s236-30 374 21"/>
    <path d="M0 774c158-54 314-63 467-29 119 27 230 24 333-8"/>
  </g>
  <g filter="url(#shadow)" transform="rotate(-18 400 520)">
    <ellipse cx="335" cy="520" rx="154" ry="92" fill="none" stroke="url(#metal)" stroke-width="52"/>
    <ellipse cx="335" cy="520" rx="92" ry="44" fill="none" stroke="#2f3030" stroke-width="16" opacity=".5"/>
    <ellipse cx="438" cy="470" rx="154" ry="92" fill="none" stroke="url(#metal)" stroke-width="48"/>
    <ellipse cx="438" cy="470" rx="92" ry="44" fill="none" stroke="#2f3030" stroke-width="16" opacity=".42"/>
    <ellipse cx="480" cy="586" rx="154" ry="92" fill="none" stroke="url(#metal)" stroke-width="44"/>
    <ellipse cx="480" cy="586" rx="92" ry="44" fill="none" stroke="#2f3030" stroke-width="14" opacity=".45"/>
  </g>
  <rect x="202" y="760" width="396" height="88" fill="#f5f0e8" opacity=".9"/>
  <text x="400" y="798" fill="#242424" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">STACKED STEEL</text>
  <text x="400" y="832" fill="#66615c" font-family="Arial, Helvetica, sans-serif" font-size="20" text-anchor="middle">BRUSHED RINGS</text>
</svg>
