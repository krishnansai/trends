services:
  personal-stylist:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      price-scraper:
        condition: service_healthy
    environment:
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: production
      PORT: "3000"
      PRICE_FINDER_LIVE_PROVIDER: crawlee
      PRICE_SCRAPER_URL: http://price-scraper:4000/scrape
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      retries: 3
      start_period: 20s
      timeout: 5s
    ports:
      - "3000:3000"
    restart: unless-stopped

  price-scraper:
    build:
      context: ./services/price-scraper
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: "4000"
      PRICE_SCRAPER_BLOCK_STYLESHEETS: "false"
      PRICE_SCRAPER_USER_AGENT: ""
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then((response)=>process.exit(response.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      retries: 3
      start_period: 30s
      timeout: 5s
    ports:
      - "4000:4000"
    restart: unless-stopped
